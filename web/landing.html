<!DOCTYPE html>
<html lang="zh" data-default-lang="<!--PICSHARE_DEFAULT_LANG-->">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--PICSHARE_SITE_TITLE--></title>
<link rel="stylesheet" href="/css/public.css">
<link rel="stylesheet" href="/css/landing.css">
</head>
<body class="landing-body">
<main class="landing" data-landing-texts="<!--PICSHARE_LANDING_TEXTS-->">
  <picture class="landing-bg">
    <source media="(orientation: portrait)" srcset="<!--PICSHARE_LANDING_BG_PORTRAIT-->">
    <img srcset="<!--PICSHARE_LANDING_BG-->" sizes="100vw" alt="">
  </picture>
  <div class="veil" style="--veil-opacity:<!--PICSHARE_LANDING_BACKDROP-->"></div>
  <!-- The whole page is the call to action; this block is only the visual
       hint (no button, no link). -->
  <div class="enter-hint" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <rect x="7" y="2.5" width="10" height="19" rx="5"/>
      <path d="M12 6.5v4"/>
    </svg>
    <span id="landing-cta" data-i18n-fallback="landing_enter_hint"><!--PICSHARE_LANDING_CTA--></span>
  </div>
  <div class="lang" id="lang-switch"></div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/landing.js"></script>
</body>
</html>
